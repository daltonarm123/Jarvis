[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Multi-agent system for content creation and automation"
authors = [
    {name = "Dalton Armstrong"},
]
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "schedule>=1.2.0",
]
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
social = [
    "tweepy>=4.14.0",
    "discord.py>=2.4.0",
    "slack-sdk>=3.27.0",
    "google-api-python-client>=2.140.0",
]
media = [
    "moviepy>=1.0.3",
]
analytics = [
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
]

[project.scripts]
jarvis = "jarvis.main:main"

[tool.setuptools.packages.find]
where = ["src"]
