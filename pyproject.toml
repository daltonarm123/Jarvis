[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Multi-agent system for content creation and automation"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "crewai",
    "openai",
    "python-dotenv",
    "asyncio",
    "requests",
    "moviepy",  # for video editing
    "pytube",   # for downloading videos
    "tweepy",   # for Twitter API, if needed
    "instabot", # for Instagram, but might need alternatives
    # Add more as needed
]
requires-python = ">=3.8"
readme = "README.md"

[project.scripts]
jarvis = "jarvis.main:main"

[tool.setuptools.packages.find]
where = ["src"]