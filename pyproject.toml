[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.2.0"
description = "Multi-agent personal AI orchestrator"
authors = [{name = "Dalton Armstrong"}]
dependencies = [
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "schedule>=1.2.0",
]
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
social = [
    "tweepy>=4.14.0",
    "discord.py>=2.4.0",
    "slack-sdk>=3.27.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
jarvis = "jarvis.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
